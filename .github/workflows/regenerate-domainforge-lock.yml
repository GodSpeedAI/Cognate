# Temporary migration helper; remove once bun.lock is committed.
name: regenerate-domainforge-lock
on:
  push:
    branches: [fix/domainforge-0211-composed-world-release]
    paths:
      - '.github/workflows/regenerate-domainforge-lock.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Generate Bun lockfile against published exact DomainForge 0.21.1
        run: |
          set -euo pipefail
          bun install --lockfile-only
          git diff --check
          git diff -- bun.lock | head -100
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore(lock): resolve published DomainForge 0.21.1"
            git push origin HEAD:fix/domainforge-0211-composed-world-release
          fi
