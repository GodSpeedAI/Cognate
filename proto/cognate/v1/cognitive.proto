syntax = "proto3";
package cognate.v1;

import "google/protobuf/struct.proto";
import "cognate/v1/identity.proto";

// Cognitive recall results (spec §16). Items always come from authoritative, authorized sources.
message RecallItem {
  string source_ref = 1;
  string source_type = 2;
  double score = 3;
  google.protobuf.Value value = 4;
  optional SemanticRef semantic_ref = 5;
}

message RecallResult {
  string status = 1; // ok | degraded
  repeated RecallItem items = 2;
  optional string reason = 3;
}
