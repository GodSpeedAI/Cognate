# One public GitHub release per Cognate SDK version, independent npm packages.
#
# Release Please still manages each package version in one linked-versions PR.
# Exactly one component (packages/cognate) owns the public GitHub release vX.Y.Z.
# The other components use private-to-the-repository component-prefixed GIT tags
# for Release Please history, NOT extra GitHub Releases. This avoids tag collisions.
#
# IMPORTANT: skip-github-release means Release Please does not create component
# tags. The tag-components job below creates those Git tags at the release SHA.
# Existing historic component-prefixed tags and releases are deliberately retained.
#
# GITHUB_TOKEN-generated tags/releases do not trigger separate GitHub workflows.
# All release and npm publish actions run in this workflow.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release-please (SDK manifest)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      cognate_release_created: ${{ steps.release.outputs['packages/cognate--release_created'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap unprefixed v0.2.0 tag from existing umbrella release
        shell: bash
        run: |
          set -euo pipefail
          # Historical releases used cognate-v0.2.0. Release Please must see
          # an equivalent plain version tag before the tag policy changes.
          if git rev-parse --verify -q refs/tags/v0.2.0 >/dev/null; then
            echo 'v0.2.0 already exists'
          elif git rev-parse --verify -q 'refs/tags/cognate-v0.2.0^{commit}' >/dev/null; then
            git tag v0.2.0 'cognate-v0.2.0^{}'
            git push origin refs/tags/v0.2.0
            echo 'Bootstrapped v0.2.0 from cognate-v0.2.0'
          else
            echo 'Cannot find historical umbrella tag cognate-v0.2.0. Refusing to invent release history.' >&2
            exit 1
          fi
      - name: Check unified SDK release configuration
        run: node scripts/check-unified-release-config.mjs
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tag-components:
    name: Tag SDK packages and finalize one public release
    needs: release-please
    if: needs.release-please.outputs.cognate_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      paths: ${{ steps.plan.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Check one SDK version and emit npm publish paths
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-unified-release-config.mjs
          node scripts/plan-sdk-release.mjs > .sdk-release-plan.json
          echo "paths=$(node -p 'JSON.stringify(require("./.sdk-release-plan.json").paths)')" >> "$GITHUB_OUTPUT"
          cat .sdk-release-plan.json
      - name: Create internal component tags, without per-package GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node -e 'const p = require("./.sdk-release-plan.json"); for (const t of p.tags) console.log(t)' |
          while IFS= read -r tag; do
            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              echo "$tag already exists; retaining existing history"
              continue
            fi
            git tag -a "$tag" -m "Cognate SDK package $tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "Created internal tag $tag"
          done
      - name: Normalize public GitHub release title to version only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./.sdk-release-plan.json").version')
          gh release edit "v$version" --title "v$version"

  publish:
    name: publish ${{ matrix.path }}
    needs: [release-please, tag-components]
    if: needs.release-please.outputs.cognate_release_created == 'true' && vars.NPM_TRUSTED_PUBLISHING_READY == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        path: ${{ fromJSON(needs.tag-components.outputs.paths) }}
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Remove obsolete always-auth configuration
        run: npm config delete always-auth 2>/dev/null || true
      - name: Resolve workspace dependency ranges
        run: node scripts/prepare-npm-package.mjs "${{ matrix.path }}"
      - name: Skip packages already on the registry (idempotent recovery)
        id: guard
        run: |
          name=$(node -p "require('./${{ matrix.path }}/package.json').name")
          version=$(node -p "require('./${{ matrix.path }}/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published — skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new — publishing"
          fi
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.guard.outputs.published == 'false'
        working-directory: ${{ matrix.path }}
        run: npm publish --access public
