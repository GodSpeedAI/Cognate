# One public GitHub release per Cognate SDK version, independent npm packages.
#
# Release Please still manages each package version in one linked-versions PR.
# Exactly one component (packages/cognate) owns the public GitHub release vX.Y.Z.
# The other components use private-to-the-repository component-prefixed GIT tags
# for Release Please history, NOT extra GitHub Releases. This avoids tag collisions.
#
# IMPORTANT: skip-github-release means Release Please does not create component
# tags. The tag-components job below creates those Git tags at the release SHA.
# Existing historic component-prefixed tags and releases are deliberately retained.
#
# GITHUB_TOKEN-generated tags/releases do not trigger separate GitHub workflows.
# All release and npm publish actions run in this workflow.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish-released-version:
        description: "Recovery: publish and verify the already-released SDK version at HEAD (never bumps versions)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please (SDK manifest)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      cognate_release_created: ${{ steps.release.outputs['packages/cognate--release_created'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap unprefixed v0.2.0 tag from existing umbrella release
        shell: bash
        run: |
          set -euo pipefail
          # Historical releases used cognate-v0.2.0. Release Please must see
          # an equivalent plain version tag before the tag policy changes.
          if git rev-parse --verify -q refs/tags/v0.2.0 >/dev/null; then
            echo 'v0.2.0 already exists'
          elif git rev-parse --verify -q 'refs/tags/cognate-v0.2.0^{commit}' >/dev/null; then
            git tag v0.2.0 'cognate-v0.2.0^{}'
            git push origin refs/tags/v0.2.0
            echo 'Bootstrapped v0.2.0 from cognate-v0.2.0'
          else
            echo 'Cannot find historical umbrella tag cognate-v0.2.0. Refusing to invent release history.' >&2
            exit 1
          fi
      - name: Check unified SDK release configuration
        run: node scripts/check-unified-release-config.mjs
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Releases only. The release PR is built by the release-pr job below, after
          # tag-components has minted the component tags. Building it here raced the tag
          # minting on every release merge: components resolved their latest release from a
          # tag that did not exist yet, looked never-released, and release-please opened a
          # spurious PR (#38; #86 proposed 0.3.0 over published 0.10.0). Ordering the jobs
          # removes the race for every merge method and commit message.
          skip-github-pull-request: true


  release-pr:
    name: release-please (release PR, after component tags exist)
    runs-on: ubuntu-latest
    needs: [release-please, tag-components]
    if: always() && github.event_name == 'push' && needs.release-please.result == 'success' && (needs.tag-components.result == 'success' || needs.tag-components.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The job ordering covers this run only. A concurrent run, or a run after a failed
      # tag-components, could still reach here before the current version's component tags
      # exist; building the PR then reproduces the spurious "never released" PR. Refuse instead:
      # the next push after the tags exist builds the PR.
      - name: Require every component tag of the current SDK version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/plan-sdk-release.mjs > .sdk-release-plan.json
          missing=$(node -e 'const {execSync}=require("child_process"); const p=require("./.sdk-release-plan.json"); console.log(p.tags.filter((t)=>{try{execSync(`git rev-parse -q --verify refs/tags/${t}`,{stdio:"ignore"});return false}catch{return true}}).join(" "))')
          if [ -n "$missing" ]; then
            echo "::error::component tags missing for the current SDK version; not building the release PR: $missing"
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
  tag-components:
    name: Tag SDK packages and finalize one public release
    needs: release-please
    if: needs.release-please.outputs.cognate_release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish-released-version == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      paths: ${{ steps.plan.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Check one SDK version and emit npm publish paths
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-unified-release-config.mjs
          node scripts/plan-sdk-release.mjs > .sdk-release-plan.json
          echo "paths=$(node -p 'JSON.stringify(require("./.sdk-release-plan.json").paths)')" >> "$GITHUB_OUTPUT"
          cat .sdk-release-plan.json
      - name: Create internal component tags, without per-package GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node -e 'const p = require("./.sdk-release-plan.json"); for (const t of p.tags) console.log(t)' |
          while IFS= read -r tag; do
            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              echo "$tag already exists; retaining existing history"
              continue
            fi
            git tag -a "$tag" -m "Cognate SDK package $tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "Created internal tag $tag"
          done
      - name: Move the public release onto the unified vX.Y.Z tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./.sdk-release-plan.json").version')
          # The umbrella releases in component-in-tag mode (cognate-vX.Y.Z) because Release
          # Please's linked-versions plugin silently drops component-less strategies from the
          # group. The public release lives on the unified vX.Y.Z tag instead.
          if git show-ref --tags --verify --quiet "refs/tags/v$version"; then
            echo "v$version already exists; retaining existing history"
          else
            git tag "v$version" "$GITHUB_SHA"
            git push origin "refs/tags/v$version"
            echo "Created unified tag v$version"
          fi
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/cognate-v$version" --jq .id)
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" -f tag_name="v$version"
          gh release edit "v$version" --title "v$version"

  publish:
    name: publish ${{ matrix.path }}
    needs: [release-please, tag-components]
    if: (needs.release-please.outputs.cognate_release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish-released-version == true)) && vars.NPM_TRUSTED_PUBLISHING_READY == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        path: ${{ fromJSON(needs.tag-components.outputs.paths) }}
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Remove obsolete always-auth configuration
        run: npm config delete always-auth 2>/dev/null || true
      - name: Resolve workspace dependency ranges
        run: node scripts/prepare-npm-package.mjs "${{ matrix.path }}"
      - name: Skip packages already on the registry (idempotent recovery)
        id: guard
        run: |
          name=$(node -p "require('./${{ matrix.path }}/package.json').name")
          version=$(node -p "require('./${{ matrix.path }}/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published — skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new — publishing"
          fi
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.guard.outputs.published == 'false'
        working-directory: ${{ matrix.path }}
        run: npm publish --access public

  verify-publication:
    name: Verify public npm publication receipts
    needs: [release-please, tag-components, publish]
    if: always() && (needs.release-please.outputs.cognate_release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish-released-version == true))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Enforce the public publication gate
        shell: bash
        env:
          NPM_TRUSTED_PUBLISHING_READY: ${{ vars.NPM_TRUSTED_PUBLISHING_READY }}
          NPM_PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          if [[ "$NPM_TRUSTED_PUBLISHING_READY" != "true" ]]; then
            echo "A release was created, but NPM_TRUSTED_PUBLISHING_READY is not true; refusing an unverified release." >&2
            exit 1
          fi
          if [[ "$NPM_PUBLISH_RESULT" != "success" ]]; then
            echo "A release was created, but the npm publish matrix result is $NPM_PUBLISH_RESULT; refusing to verify an incomplete release." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify every release version is publicly visible at the release commit
        run: node scripts/verify-sdk-publication.mjs "$GITHUB_SHA" > npm-publication-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-publication-receipt-${{ github.sha }}
          path: npm-publication-receipt.json
          if-no-files-found: error
