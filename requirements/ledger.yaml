acceptance_contracts:
  - id: AC-001-01
    requirement: AK-001
    expected: 'A committed event survives reopen; a failed transaction leaves no event; a stale expected revision cannot append.'
  - id: AC-002-01
    requirement: AK-002
    expected: 'The tested Cordis release activates, deactivates on dependency loss, rolls back failed setup, and disposes in reverse order under Bun.'
  - id: AC-003-01
    requirement: AK-003
    expected: 'The selected Graph binding parses a valid sea fixture under Bun and preserves stable semantic source identity; rename and namespace change produce new identities; missing references are typed.'
  - id: AC-004-01
    requirement: AK-004
    expected: 'Byte-identical codegen; generated client performs unary and server-streaming RPC, cancellation, deadline and error mapping against a real Bun server; unsupported modes are recorded, not claimed.'
  - id: AC-005-01
    requirement: AK-005
    expected: 'The selected RuVector binding rebuilds derived entries and an unavailable binding triggers deterministic behavior without authority changes.'
  - id: AC-006-01
    requirement: AK-006
    expected: 'CLI prerequisites complete; a correlated observation is accepted; duplicate delivery is reconciled without claiming evidence or settlement.'
  - id: AC-007-01
    requirement: AK-007
    expected: 'The selected RVF binding loads under Bun and export, import, and branch operations remain isolated from authoritative history.'
  - id: AC-008-01
    requirement: AK-008
    expected: 'SONA ranks only a supplied candidate set, replays durable feedback deterministically, and falls back to deterministic ordering when unavailable.'
  - id: AC-009-01
    requirement: AK-009
    expected: 'The pinned @ag-ui/core loads under Bun and validates and rejects the event families in the supported matrix.'
  - id: AC-010-01
    requirement: AK-010
    expected: 'React 19 and Astryx render and bundle under Bun; a browser journey can be driven against a Bun server.'
  - id: AC-011-01
    requirement: AK-011
    expected: 'An MCP server exposing one tool is listed and called by a linked client under Bun.'
  - id: AC-KRN-001-01
    requirement: CG-KRN-001
    expected: 'The kernel conformance kit passes against the reference engine for every 8.5 operation and failure semantic.'
  - id: AC-KRN-002-01
    requirement: CG-KRN-002
    expected: 'Lifecycle transitions follow 8.4 including FAILED retry with bounded backoff and explicit reset after permanent failure.'
  - id: AC-KRN-003-01
    requirement: CG-KRN-003
    expected: 'Disposers run in reverse registration order, a failing disposer does not stop others, and errors are aggregated and observable.'
  - id: AC-KRN-004-01
    requirement: CG-KRN-004
    expected: 'Removing a provider deactivates dependents; restoring a compatible provider reactivates them without consumer import changes.'
  - id: AC-KRN-005-01
    requirement: CG-KRN-005
    expected: 'Child-provided isolated capabilities are invisible to parent and siblings; closing a parent closes children first.'
  - id: AC-KRN-006-01
    requirement: CG-KRN-006
    expected: 'Invocation denied by policy returns a typed denial; a lease used after provider loss yields CapabilityUnavailable.'
  - id: AC-KRN-007-01
    requirement: CG-KRN-007
    expected: 'No package other than kernel-cordis imports cordis, and kernel-api public types reference no engine type.'
  - id: AC-KRN-008-01
    requirement: CG-KRN-008
    expected: 'fast-check properties over generated graphs and appearance/removal/disposal sequences hold.'
  - id: AC-EVT-001-01
    requirement: CG-EVT-001
    expected: 'Envelopes missing required fields are rejected; stored envelopes carry every 10 field.'
  - id: AC-EVT-002-01
    requirement: CG-EVT-002
    expected: 'A conflicting writer fails explicitly; sequences are gap-free per stream and assigned inside the append transaction.'
  - id: AC-EVT-003-01
    requirement: CG-EVT-003
    expected: 'Repeating a committed idempotency key returns the recorded result without a new fact; a failure mid-decision leaves nothing visible.'
  - id: AC-EVT-004-01
    requirement: CG-EVT-004
    expected: 'The store conformance kit passes on SQLite, state survives reopen, and a failed write reports failure without a claimed commit.'
  - id: AC-EVT-005-01
    requirement: CG-EVT-005
    expected: 'The store conformance kit passes on the memory store.'
  - id: AC-EVT-006-01
    requirement: CG-EVT-006
    expected: 'A child process killed during a decision leaves no partial state; a retried idempotent command after a committed crash returns the recorded result.'
  - id: AC-PRJ-001-01
    requirement: CG-PRJ-001
    expected: 'Duplicate events are ignored by id; output and checkpoint commit together; a poison event enters an explicit error state with an operator replay path.'
  - id: AC-PRJ-002-01
    requirement: CG-PRJ-002
    expected: 'After deleting projection tables and checkpoints, rebuild produces state equal to the pre-deletion state.'
  - id: AC-PRJ-003-01
    requirement: CG-PRJ-003
    expected: 'fast-check generated event sequences replay to equal state across stores and repeated runs.'
  - id: AC-CON-001-01
    requirement: CG-CON-001
    expected: 'Concurrent resume/cancel/expire commands produce one terminal event; duplicates return the existing outcome; resume is authorized.'
  - id: AC-CON-002-01
    requirement: CG-CON-002
    expected: 'After process restart a pending continuation resumes via a new handler; an unsupported handler version enters BLOCKED.'
  - id: AC-CMT-001-01
    requirement: CG-CMT-001
    expected: 'Timeouts after dispatch become UNKNOWN_RECONCILIATION_REQUIRED; targets without idempotency are not blindly retried; compensation is a new record.'
  - id: AC-CMT-002-01
    requirement: CG-CMT-002
    expected: 'Outbox items dispatch after commit, retry with bounded backoff, deduplicate by stable id, and surface failed items.'
  - id: AC-ART-001-01
    requirement: CG-ART-001
    expected: 'Artifacts record hash, media type, size, policy, retention; deletion leaves a tombstone distinguishable from loss.'
  - id: AC-CAP-001-01
    requirement: CG-CAP-001
    expected: 'Selection records candidate set, filters, scores, selected candidate, and later outcome as durable facts.'
  - id: AC-CAP-002-01
    requirement: CG-CAP-002
    expected: 'For arbitrary candidates, policies, and rankers, the selected candidate is always eligible.'
  - id: AC-SEC-001-01
    requirement: CG-SEC-001
    expected: 'Erasing a payload removes its content, records a tombstone and reason, and replay/cognition report a redacted gap.'
  - id: AC-SEC-002-01
    requirement: CG-SEC-002
    expected: 'A secret-bearing provider run leaves no secret bytes in the SQLite file or cognitive index.'
  - id: AC-OBS-001-01
    requirement: CG-OBS-001
    expected: 'A runtime inspection query reconstructs correlation, run, event, causation, component, fiber, capability, provider, semantic ref, artifact, and observation ids.'
  - id: AC-WIR-001-01
    requirement: CG-WIR-001
    expected: 'proto/ compiles twice to byte-identical packages/proto output with the pinned toolchain.'
  - id: AC-WIR-002-01
    requirement: CG-WIR-002
    expected: 'A separate Bun process starts a run, streams its events, and resolves a continuation via generated clients.'
  - id: AC-WIR-003-01
    requirement: CG-WIR-003
    expected: 'The same service conformance suite passes in-process and over Connect.'
  - id: AC-WIR-004-01
    requirement: CG-WIR-004
    expected: 'Oversized, too-deep, unauthenticated, or deadline-exceeded requests are rejected with typed errors.'
  - id: AC-SEM-001-01
    requirement: CG-SEM-001
    expected: 'Graph output maps to read-only semantic objects with provenance; unsupported kinds are listed; no capability exists without an explicit manifest binding.'
  - id: AC-SEM-002-01
    requirement: CG-SEM-002
    expected: 'Rename, missing reference, and version change golden fixtures pass; historical refs resolve against archived projections.'
  - id: AC-RT-001-01
    requirement: CG-RT-001
    expected: 'Observations queue from the committed outbox, retry with stable ids, expose reconciliation status, and never report evidence.'
  - id: AC-RT-002-01
    requirement: CG-RT-002
    expected: 'Against the real CLI, prerequisites complete, an observation is accepted with a persisted receipt, and duplicate retry reconciles.'
  - id: AC-RT-003-01
    requirement: CG-RT-003
    expected: 'One test traces a parsed semantic object through runtime execution to a committed event and a queued observation.'
  - id: AC-COG-001-01
    requirement: CG-COG-001
    expected: 'The cognitive conformance kit passes for the memory implementation and flags reflect supported operations.'
  - id: AC-COG-002-01
    requirement: CG-COG-002
    expected: 'Restricted hits are absent from results, counts, and provenance; returned items come from authoritative fetch.'
  - id: AC-COG-003-01
    requirement: CG-COG-003
    expected: 'The cognitive conformance kit passes against the RuVector adapter.'
  - id: AC-COG-004-01
    requirement: CG-COG-004
    expected: 'Authorization and deterministic outcomes are identical before deletion, after deletion, and after rebuild; recall returns after rebuild.'
  - id: AC-COG-005-01
    requirement: CG-COG-005
    expected: 'With a failing index, selection and runs complete deterministically; a component declaring cognition required waits.'
  - id: AC-COG-006-01
    requirement: CG-COG-006
    expected: 'Feedback appends an event before ranking changes; rebuild from events restores equivalent ranking inputs.'
  - id: AC-RVF-001-01
    requirement: CG-RVF-001
    expected: 'Snapshots record checkpoint lineage; branch writes are isolated; tampered or foreign imports stay detached.'
  - id: AC-CLT-001-01
    requirement: CG-CLT-001
    expected: 'The client resumes a subscription from a cursor after disconnect, resolves a continuation, and serves a frontend capability, with no React dependency.'
  - id: AC-UI-001-01
    requirement: CG-UI-001
    expected: 'Hooks render projection updates and register a frontend capability in a React 19 test renderer.'
  - id: AC-UI-002-01
    requirement: CG-UI-002
    expected: 'Reference surfaces render under Bun SSR and in a browser bundle with light and dark themes.'
  - id: AC-UI-003-01
    requirement: CG-UI-003
    expected: 'Dependency checks and type exports show no Astryx import in client or react and no React import in client.'
  - id: AC-AGUI-001-01
    requirement: CG-AGUI-001
    expected: 'Run, message, tool, and state projections emit schema-valid AG-UI events whose ids map to durable events; unsupported kinds follow the matrix.'
  - id: AC-AGUI-002-01
    requirement: CG-AGUI-002
    expected: 'User messages, tool results, approvals, and cancellation carry identity and idempotency and are authorized; unfaithful interactions return typed unsupported.'
  - id: AC-AGUI-003-01
    requirement: CG-AGUI-003
    expected: 'Reconnect from a known cursor yields snapshot plus ordered deltas; an expired cursor or gap triggers full resync.'
  - id: AC-MCP-001-01
    requirement: CG-MCP-001
    expected: 'An MCP client lists and calls runtime capabilities through policy; denied calls return typed errors.'
  - id: AC-A2A-001-01
    requirement: CG-A2A-001
    expected: 'A pinned A2A client discovers the agent card and completes a task backed by a runtime capability.'
  - id: AC-PRV-001-01
    requirement: CG-PRV-001
    expected: 'Providers declare generate/stream/tool_use/structured_output flags; the OpenAI-compatible provider works against a local HTTP stub; the local provider is deterministic.'
  - id: AC-PRF-001-01
    requirement: CG-PRF-001
    expected: 'Profiles resolve to component lists over existing packages; kernel-api exports are unchanged by profiles.'
  - id: AC-PRF-002-01
    requirement: CG-PRF-002
    expected: 'Streamed response, frontend and backend tools, shared state, approval, artifact, generative UI, resume, and AG-UI output pass.'
  - id: AC-PRF-003-01
    requirement: CG-PRF-003
    expected: 'Providers, tool registry, agent loop, sessions, storage, skills, scheduler, sandbox, subagents, and provide/remove/restore reactivation pass.'
  - id: AC-CLI-001-01
    requirement: CG-CLI-001
    expected: 'In a clean directory the generated project installs pinned packages, runs dev, executes a semantic projection, survives restart, and passes bun test.'
  - id: AC-E2E-001-01
    requirement: CG-E2E-001
    expected: 'The 36 journey passes in Playwright or each unmet step fails with its blocking gate.'
  - id: AC-ARC-001-01
    requirement: CG-ARC-001
    expected: 'Every allowed edge is permitted, every forbidden edge is absent, and the package graph is acyclic.'
  - id: AC-ARC-002-01
    requirement: CG-ARC-002
    expected: 'Each 40 criterion maps to requirement gates that pass, or the criterion is reported unmet with a debt entry.'
