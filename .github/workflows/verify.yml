name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with packages/domainforge BINDING and the realitytrace pin in the justfile.
  DOMAINFORGE_VERSION: "0.19.0"

jobs:
  verify:
    name: verify (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned CLIs
        id: clis
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/domainforge
            .tmp/realitytrace
          key: clis-${{ runner.os }}-df${{ env.DOMAINFORGE_VERSION }}-${{ hashFiles('justfile') }}
      - name: Install the DomainForge CLI and RealityTrace
        if: steps.clis.outputs.cache-hit != 'true'
        run: |
          cargo install domainforge-core --version "$DOMAINFORGE_VERSION" --features cli --locked
          just setup-realitytrace
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          for d in compatibility/phase0/*/; do
            # The compatibility probes pin third-party packages; a stale lockfile there is
            # not a regression in this repo, so they install unfrozen.
            if [ -f "$d/package.json" ]; then (cd "$d" && bun install); fi
          done
      - name: Install the Playwright browser
        run: bunx playwright install --with-deps chromium
      # PostgreSQL matrix (DEBT-011): the pinned pg0 binary (PostgreSQL 18.1 + pgvector, checksum
      # verified) provides the server. pg0 is single-binary and runs as the non-root CI user.
      # CG-SEC-001's gate (erasure) and the store/runtime/multi-process/convergence kits now run
      # against PostgreSQL, so the database must be up before `just verify`.
      - name: just db-setup && just db-up
        run: |
          just db-setup
          just db-up
      # The regression baseline: substrate check, typecheck, gate-runner tests and
      # every gate claimed implemented. Live gates that need a real SEA-Forge,
      # sshd or WSL stay out of CI and are run locally (`just sea-forge-live`).
      - name: just verify
        run: |
          export PATH="$HOME/.cargo/bin:$PWD/.tmp/realitytrace/bin:$PATH"
          just verify
      - name: Provider and agent interoperability conformance
        run: |
          bun test packages/hook-interoperability packages/agent-discovery packages/provider-auth packages/provider-openai-responses packages/provider-anthropic-compatible packages/provider-typesafe packages/provider-wire packages/provider-openai-oauth
          bun test validation/reconstructions/deepseek-harness/cognate/test/J-CFG-model-provider.test.ts validation/reconstructions/deepseek-harness/cognate/test/providerRegistry.test.ts
      - name: PostgreSQL-backed suites
        run: |
          bun test packages/store-postgres
          bun test packages/runtime-bun/test/concurrency.test.ts packages/runtime-bun/test/async-admission.test.ts
          bun test packages/runtime-bun/test/service-postgres.test.ts
          bun test tests/integration/postgres-multiprocess.test.ts
          bun test tests/integration/projection-convergence.test.ts
          bun test tests/integration/erasure.test.ts
